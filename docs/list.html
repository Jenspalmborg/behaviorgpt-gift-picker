<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift Shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfaf8; --surface: #ffffff; --ink: #16140f; --ink-2: #57524a; --ink-3: #8f887d; --line: #ebe7e0;
    --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fdf0e8;
    --shadow: 0 1px 2px rgba(22, 20, 15, .04), 0 8px 24px rgba(22, 20, 15, .06);
    --radius: 16px; --serif: "Fraunces", Georgia, serif; --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12110e; --surface: #1c1a16; --ink: #f4f1ec; --ink-2: #bdb6ab; --ink-3: #857e73;
      --line: #2c2924; --accent: #f97316; --accent-ink: #1a0d04; --accent-soft: #2b1a0e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  @media (max-width: 600px) { .wrap { padding: 0 16px; } }

  nav { border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); text-decoration: none; }
  .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
  .logo-mark svg { width: 17px; height: 17px; }
  nav a.own { font-size: 14px; color: var(--ink-2); }

  header { padding: 36px 0 20px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -.02em; margin: 0 0 6px; }
  header p { margin: 0; color: var(--ink-2); }

  ol { list-style: none; margin: 0 0 48px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
       padding: 12px 14px; box-shadow: var(--shadow); }
  li .img { width: 76px; height: 76px; flex: none; background: #fff; border-radius: 10px; display: grid; place-items: center; overflow: hidden; }
  li img { max-width: 88%; max-height: 88%; object-fit: contain; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .reason { font-size: 12px; font-weight: 600; color: var(--accent); }
  .name { font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-2); }
  .meta a { color: var(--ink-2); text-underline-offset: 3px; }
  .price { font-family: var(--serif); font-weight: 600; color: var(--ink); font-size: 17px; }
  .vote { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 8px 10px;
          border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink-2); font: inherit; cursor: pointer;
          transition: border-color .15s, background .15s; }
  .vote:hover { border-color: var(--ink); }
  .vote[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .vote svg { width: 18px; height: 18px; }
  .vote b { font-size: 15px; }
  .leader { outline: 2px solid var(--accent); outline-offset: -1px; }
  .empty { text-align: center; padding: 48px 24px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--ink-2); }
  @media (max-width: 520px) { li { gap: 12px; padding: 10px; } li .img { width: 60px; height: 60px; } .vote { min-width: 52px; padding: 6px; } }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="logo" href="./">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></span>
      Gift Picker
    </a>
    <a class="own" href="./">Find gifts yourself →</a>
  </div>
</nav>
<main class="wrap">
  <header><h1 id="title">Gift shortlist</h1><p id="sub">Loading…</p></header>
  <ol id="items" aria-live="polite"></ol>
</main>
<script src="config.js"></script>
<script>
const API = window.GIFT_API || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// list.html?id=… (and the older /list/<id> links, which redirect here).
const listId = new URLSearchParams(location.search).get("id") || "";
const THUMB = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9Z"/></svg>`;

// Which items this browser voted for, so a second tap takes the vote back.
const VOTES_KEY = `giftpicker.votes.${listId}`;
let mine = new Set();
try { mine = new Set(JSON.parse(localStorage.getItem(VOTES_KEY)) || []); } catch {}
const storeMine = () => { try { localStorage.setItem(VOTES_KEY, JSON.stringify([...mine])); } catch {} };

let list = null, order = null;

function render() {
  const who = list.person || "someone";
  const occasion = list.occasion ? `${list.occasion[0].toUpperCase()}${list.occasion.slice(1)} gift` : "Gift";
  document.title = `${occasion} ideas for ${who}`;
  $("title").textContent = `${occasion} ideas for ${who}`;
  $("sub").textContent = "Tap 👍 on the ones you like best. Tap again to take it back.";
  // Sorted by votes once on load; afterwards rows stay put so they don't jump under the finger.
  order ??= list.items.map((g, i) => [g.votes, -i, g.id]).sort((a, b) => b[0] - a[0] || b[1] - a[1]).map(x => x[2]);
  const byId = Object.fromEntries(list.items.map(g => [g.id, g]));
  const top = Math.max(...list.items.map(g => g.votes));
  $("items").innerHTML = order.map(id => byId[id]).map(g => `
    <li class="${top > 0 && g.votes === top ? "leader" : ""}">
      <div class="img">${g.image_url ? `<img src="${esc(g.image_url)}" alt="" loading="lazy">` : ""}</div>
      <div class="info">
        ${g.reason ? `<div class="reason">${esc(g.reason)}</div>` : ""}
        <div class="name" title="${esc(g.name)}">${esc(g.name)}</div>
        <div class="meta">${g.price != null ? `<span class="price">$${g.price.toFixed(2)}</span>` : ""}<a href="${esc(g.url)}" target="_blank" rel="noopener">See it →</a></div>
      </div>
      <button class="vote" type="button" data-id="${esc(g.id)}" aria-pressed="${mine.has(g.id)}" aria-label="Vote for ${esc(g.name)}, ${g.votes} votes">${THUMB}<b>${g.votes}</b></button>
    </li>`).join("");
  $("items").querySelectorAll(".vote").forEach(b => b.onclick = () => vote(b.dataset.id, b));
}

async function vote(id, button) {
  button.disabled = true;
  const delta = mine.has(id) ? -1 : 1;
  try {
    const res = await fetch(`${API}/api/lists/${encodeURIComponent(listId)}/votes`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ item_id: id, delta }),
    });
    if (!res.ok) throw new Error();
    list = await res.json();
    delta > 0 ? mine.add(id) : mine.delete(id); storeMine();
  } catch {
    $("sub").textContent = "Couldn’t save that vote. Try again.";
  }
  render();
}

fetch(`${API}/api/lists/${encodeURIComponent(listId)}`)
  .then(async res => { const data = await res.json(); if (!res.ok) throw new Error(data.detail); return data; })
  .then(data => { list = data; render(); })
  .catch(err => {
    $("sub").textContent = "";
    $("items").outerHTML = `<div class="empty">${esc(err.message || "Couldn’t load this list.")}</div>`;
  });
</script>
</body>
</html>
